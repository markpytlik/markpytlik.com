<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casper — Mark Pytlik</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0A">

<script>
  /* Deep-link guard — runs before anything renders. Convenience only,
     not security: enforce access server-side for real privacy. */
  (function () {
    try {
      var c = sessionStorage.getItem('mp_work_code');
      var a = JSON.parse(sessionStorage.getItem('mp_work_cases') || '[]');
      if (!c || a.indexOf('casper') === -1) location.replace('work.html');
    } catch (e) {
      location.replace('work.html');
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>

<body data-case="casper">
<div class="case-page">
  <div class="grain" aria-hidden="true"></div>

  <div class="case-bar">
    <a href="work.html">← Selected Work</a>
    <span id="case-index"></span>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="true">Dark</button>
    </div>
  </div>

  <article class="ink">
    <div class="case-title">
      <span class="eyebrow" id="case-eyebrow"></span>
      <h1 id="case-title"></h1>
    </div>

    <img class="case-hero" id="case-hero" src="" alt="">

    <p class="case-intro" id="case-intro"></p>

    <div class="case-blocks" id="case-blocks"></div>

    <div class="case-foot">
      <a href="work.html">← All work</a>
      <a href="mailto:hi@markpytlik.com">Get in touch ↗</a>
    </div>
  </article>
</div>

<script src="js/media.js"></script>
<script src="js/cases.js"></script>
<script src="js/case.js"></script>
</body>
</html>
