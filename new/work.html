<body>
<div class="bg-fx" data-bg-fx aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="page-card">


<!-- Locked -->
<div class="lock" id="locked">
  <div class="lock-card">
    <div class="lock-head">
      <h1>Selected Work</h1>
    </div>

    <form class="lock-form" id="lock-form">
      <div id="lock-field" class="lock-field">
        <label class="visually-hidden" for="lock-input" hidden>Access code</label>
        <input class="lockinput" id="lock-input" type="password" placeholder="Access code" autocomplete="off" autofocus>
      </div>
      <span class="lock-error" id="lock-error" hidden>Invalid code — try again</span>
      <button type="submit" class="btn">Enter ↗</button>
    </form>
  </div>
</div>

<!-- Unlocked -->
<main class="work-main" id="unlocked" hidden>
  <header class="work-head" data-reveal>
    <div class="meta-row mono">
      <span>Welcome, <span id="visitor"></span></span>
    </div>
    <h1>Case Studies</h1>
    <p id="work-note"></p>
  </header>

  <div class="caselist" id="caselist" data-reveal></div>

  <div class="work-foot mono" style="letter-spacing:.06em;" data-reveal>
    <a href="index.html" class="navlink">← Back to home</a>
    <button type="button" class="navlink linkbtn" id="lock-again">Lock again</button>
  </div>
</main>

</div><!-- /.page-card -->

<script src="js/reveal.js?v=1784927834"></script>

</body>
</html>
